[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "production-scheduling-agent"
version = "0.1.0"
description = "Original local scheduling analysis with real constraint solving and independently validated synthetic execution"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<0.29",
  "langgraph==1.2.5",
  "langsmith>=0.14.14,<0.15",
  "ortools>=9.12,<10",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
production-scheduling = "scheduling_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduling_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
